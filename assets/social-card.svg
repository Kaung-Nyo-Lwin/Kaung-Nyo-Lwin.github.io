<radialGradient id="glow" cx="920" cy="290" r="330" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0A7587" stop-opacity=".12"/><stop offset=".6" stop-color="#3949B5" stop-opacity=".05"/><stop offset="1" stop-color="#3949B5" stop-opacity="0"/></radialGradient>
