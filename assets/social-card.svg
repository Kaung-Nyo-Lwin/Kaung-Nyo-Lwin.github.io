<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<title>Kaung Nyo Lwin, AI Engineer and Researcher</title>
<defs>
<style>
@font-face{font-family:"IBM Plex Sans";src:url("fonts/ibm-plex-sans-400.woff2") format("woff2");font-weight:400}
@font-face{font-family:"IBM Plex Sans";src:url("fonts/ibm-plex-sans-500.woff2") format("woff2");font-weight:500}
@font-face{font-family:"IBM Plex Sans";src:url("fonts/ibm-plex-sans-600.woff2") format("woff2");font-weight:600}
svg{--accent:#0A7587;--accent2:#3949B5;--paper:#fff}
text{font-family:"IBM Plex Sans",Arial,sans-serif}
.kicker{font-size:21px;font-weight:600;letter-spacing:3px;fill:#0A7587}
.name{font-size:84px;font-weight:500;letter-spacing:-2.6px;fill:#16202C}
.lede{font-size:29px;font-weight:400;fill:#2A3341}
.pill{font-size:20px;font-weight:500;fill:#0A7587}
.url{font-size:23px;font-weight:500;fill:#0A7587}
.motif .l0{--c:var(--accent)}.motif .l1{--c:color-mix(in oklab,var(--accent) 75%,var(--accent2))}
.motif .l2{--c:color-mix(in oklab,var(--accent) 50%,var(--accent2))}.motif .l3{--c:color-mix(in oklab,var(--accent) 25%,var(--accent2))}
.motif .l4{--c:var(--accent2)}
.motif-edges path{fill:none;stroke:var(--c);stroke-width:1}
.motif-nodes circle{fill:#fff;stroke:color-mix(in srgb,var(--c) 62%,#fff);stroke-width:1.6}
.motif-path{fill:none;stroke:url(#motif-grad);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.motif-active .halo{fill:var(--c);opacity:.14}.motif-active .dot{fill:var(--c);stroke:#fff;stroke-width:2}
</style>
